# Render Blueprint - 一键部署配置
# 访问 https://render.com/blueprints 上传此文件部署

services:
  - type: web
    name: lof-monitor
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
